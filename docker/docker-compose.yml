# Run commands from the project root, for example:
#   docker compose -f docker/docker-compose.yml run --rm train
#   docker compose -f docker/docker-compose.yml up serve
name: composite-cement-strength

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: composite-cement-strength:latest
  volumes:
    - ../config.yaml:/app/config.yaml:ro
    - ../data:/app/data
    - ../artifacts:/app/artifacts
    - ../logs:/app/logs

services:
  app:                # generic: pass any CLI command
    <<: *app

  ingest:
    <<: *app
    command: ["ingest"]

  preprocess:
    <<: *app
    command: ["preprocess"]

  train:
    <<: *app
    command: ["train"]

  evaluate:
    <<: *app
    command: ["evaluate"]

  run-all:
    <<: *app
    command: ["run-all"]

  predict:
    <<: *app
    command:
      - "predict"
      - "--input"
      - "data/raw/Concrete_Data.csv"
      - "--output"
      - "artifacts/reports/predictions.csv"

  serve:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
