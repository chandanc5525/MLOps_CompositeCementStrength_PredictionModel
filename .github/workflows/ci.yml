name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        run: python main.py run-all

      - name: Batch prediction smoke test
        run: >-
          python main.py predict
          --input data/raw/Concrete_Data.csv
          --output artifacts/reports/predictions.csv

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t composite-cement-strength .

      - name: Run pipeline in container
        run: docker compose -f docker/docker-compose.yml run --rm run-all
