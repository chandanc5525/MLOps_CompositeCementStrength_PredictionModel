
# Central configuration for Composite Cement Strength Prediction

project:
  name: composite-cement-strength-prediction
  task: regression

data:
  path: data/raw/Concrete_Data.csv
  target: "Concrete compressive strength(MPa, megapascals) "
  test_size: 0.30
  random_state: 1

preprocessing:
  handle_missing_values: true
  imputation_strategy: median
  remove_duplicates: true

model:
  type: random_forest

  available_models:
    - decision_tree
    - random_forest
    - extra_trees

  params:
    decision_tree:
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1

    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
      n_jobs: -1

    extra_trees:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
      n_jobs: -1

artifacts:
  model_dir: artifacts/models
  report_dir: artifacts/reports

logging:
  level: INFO
  file: logs/mlops.log

evaluation:
  metrics:
    - r2
    - mae
    - mse
    - rmse

serve:
  host: 127.0.0.1
  port: 8000
