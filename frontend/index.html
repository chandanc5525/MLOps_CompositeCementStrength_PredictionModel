<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Composite Cement Strength Prediction</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Composite Cement Strength</h1>
      <p class="subtitle">Predict concrete compressive strength (MPa) from mixture composition.</p>
      <p id="status" class="status">Loading model…</p>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>Model</h2>
      </div>
      <div id="model-info" class="chips"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Single prediction</h2>
        <button id="fill-sample" class="ghost" type="button">Fill sample</button>
      </div>
      <form id="predict-form">
        <div id="feature-grid" class="grid"></div>
        <button class="primary" type="submit">Predict strength</button>
      </form>
      <output id="result" class="result" hidden></output>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Batch prediction</h2>
      </div>
      <p class="hint">Upload a CSV with the same feature columns. A prediction column is added.</p>
      <input id="csv-input" type="file" accept=".csv" />
      <div id="batch-result" class="result" hidden></div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
